packages:
  - 'packages/*'
  - 'packages/server/src/mothership-app'

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  cpu-features: false
  dtrace-provider: true
  esbuild: true
  lzma-native: true
  protobufjs: true
  sharp: true
  ssh2: true
  svelte-preprocess: set this to true or false
  workerd: true

minimumReleaseAgeExclude:
  - better-sqlite3@12.10.1
  - '@sveltejs/kit@2.65.1'
