# PocketHost's release config. Don't run goreleaser directly: release.sh passes the tags, the PocketOne version and
# the notes (see CHANGELOG.md for the whole release process).
#
#   packages/pockethost-go/release/release.sh v5.0.0-alpha.1
#   packages/pockethost-go/release/release.sh --snapshot
#
version: 2

project_name: pockethost

dist: packages/pockethost-go/.builds

before:
  hooks:
    - go -C packages/pockethost-go mod tidy

builds:
  - id: pockethost
    dir: packages/pockethost-go
    main: ./cmd/pockethost
    binary: pockethost
    flags:
      - -trimpath
    ldflags:
      # this release, and the PocketOne release go.mod pins (empty when the pin is a commit between releases; then
      # `pockethost version` names the commit)
      - -s -w -X main.Version={{ .Version }} -X ganigeorgiev.com/pocketbase/pocketbase.Version={{ .Env.POCKETONE_VERSION }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    # the same targets as PocketOne's release
    goarch:
      - amd64
      - arm64
      - arm
      - s390x
      - ppc64le
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: ppc64le
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: ppc64le

archives:
  - id: pockethost
    ids: [pockethost]
    formats: [zip]
    files:
      - src: packages/pockethost-go/CHANGELOG.md
        dst: CHANGELOG.md
      - src: LICENSE*
        dst: .

# Linux packages, like PocketOne's: the binary in /usr/bin, a systemd unit (deb, rpm) that runs `pockethost serve` as
# the pockethost user with its data in /var/lib/pockethost, and its config in /etc/pockethost (kept on upgrade). Named
# like the zips (pockethost_<version>_linux_<arch>.deb).
nfpms:
  - id: packages
    ids: [pockethost]
    package_name: pockethost
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    formats: [deb, rpm, apk]
    vendor: PocketHost
    maintainer: PocketHost <noreply@pockethost.io>
    homepage: https://pockethost.io
    description: PocketHost, PocketBase hosting, built on PocketOne
    license: MIT
    bindir: /usr/bin
    contents:
      - src: packages/pockethost-go/release/packaging/pockethost.service
        dst: /usr/lib/systemd/system/pockethost.service
        packager: deb
      - src: packages/pockethost-go/release/packaging/pockethost.service
        dst: /usr/lib/systemd/system/pockethost.service
        packager: rpm
      - src: packages/pockethost-go/release/packaging/pocketone.yaml
        dst: /etc/pockethost/pocketone.yaml
        type: config|noreplace
      - src: packages/pockethost-go/release/packaging/service.env
        dst: /etc/pockethost/service.env
        type: config|noreplace
    scripts:
      postinstall: packages/pockethost-go/release/packaging/postinstall.sh
      preremove: packages/pockethost-go/release/packaging/preremove.sh
      postremove: packages/pockethost-go/release/packaging/postremove.sh

checksum:
  name_template: 'checksums.txt'

snapshot:
  # release.sh --snapshot builds on the newest v5+ tag (v5.0.0-alpha.0 before the first): 5.0.0-alpha.0-next
  version_template: '{{ .Version }}-next'

release:
  github:
    owner: pockethost
    name: pockethost
  draft: true
  # v5.0.0-alpha.1 has a prerelease part, so it's published as a GitHub prerelease and never "Latest"
  prerelease: auto
  name_template: 'PocketHost {{ .Tag }}'
  header: |
    ## Install or upgrade

    **New install on macOS or Linux:**

    ```bash
    brew install pockethost/tap/pockethost
    ```

    That's Homebrew; the formula comes from [pockethost/homebrew-tap](https://github.com/pockethost/homebrew-tap). Or download the zip for your platform below.

    **New install on Windows:**

    ```powershell
    scoop bucket add pockethost https://github.com/pockethost/scoop-bucket
    scoop install pockethost
    ```

    That's [Scoop](https://scoop.sh); the manifest comes from [pockethost/scoop-bucket](https://github.com/pockethost/scoop-bucket). Or download the zip for your platform below.

    **Upgrade:**

    ```bash
    brew update && brew upgrade pockethost
    ```

    `brew update` refreshes the tap first: Homebrew does that on its own only once a day, so a plain `brew upgrade` can miss a release that's hours old.

    On Windows with Scoop, `scoop update pockethost`. Or download the zip below. Check the **Upgrading** section below, if this release has one, before you upgrade.

    **The npm `pockethost` CLI** also installs a `pockethost` command. If you have it (`npm ls -g pockethost`), whichever comes first on your PATH wins; the npm CLI still has commands this binary doesn't yet.

    ## What's in this release

# The Homebrew formula in pockethost/homebrew-tap. goreleaser pushes it even for a draft release (checked on
# v5.0.0-alpha.1), so the formula's urls 404 until the draft is published.
brews:
  - name: pockethost
    ids: [pockethost]
    repository:
      owner: pockethost
      name: homebrew-tap
    directory: Formula
    homepage: https://pockethost.io
    description: PocketHost, PocketBase hosting, built on PocketOne
    license: MIT
    commit_author:
      name: PocketHost
      email: noreply@pockethost.io
    install: |
      bin.install "pockethost"
    test: |
      system "#{bin}/pockethost", "version"

# The Scoop manifest in pockethost/scoop-bucket (Windows), pushed like the formula above, so it also points at a draft
# until the release is published.
scoops:
  - name: pockethost
    ids: [pockethost]
    repository:
      owner: pockethost
      name: scoop-bucket
    directory: bucket
    homepage: https://pockethost.io
    description: PocketHost, PocketBase hosting, built on PocketOne
    license: MIT
    commit_author:
      name: PocketHost
      email: noreply@pockethost.io

# GitHub renders every newline in release notes as a line break: never hard-wrap the header above or CHANGELOG.md.
# --release-notes (from release.sh) skips goreleaser's generated changelog.
